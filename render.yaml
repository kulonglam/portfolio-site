services:
  # =======================
  # 🎨 FRONTEND (React + Vite)
  # =======================
  - type: web
    name: kulonglam-portfolio-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 18

  # =======================
  # ⚙️ BACKEND (Node + Express)
  # =======================
  - type: web
    name: kulonglam-portfolio-backend
    env: node
    plan: free
    region: frankfurt
    buildCommand: cd backend && npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/contact
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_RECEIVER
        sync: false
